name: Frontend CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  OWNER_TAG: aicha-conteneur

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Azure resources by tags
        id: resources
        shell: bash
        run: |
          BACKEND_APP_NAME=$(az resource list \
            --query "[?type=='Microsoft.Web/sites' && tags.owner=='$OWNER_TAG' && tags.component=='backend'].name | [0]" \
            --output tsv)

          BACKEND_RESOURCE_GROUP=$(az resource list \
            --query "[?type=='Microsoft.Web/sites' && tags.owner=='$OWNER_TAG' && tags.component=='backend'].resourceGroup | [0]" \
            --output tsv)

          STATIC_WEB_APP_NAME=$(az resource list \
            --query "[?type=='Microsoft.Web/staticSites' && tags.owner=='$OWNER_TAG' && tags.component=='frontend'].name | [0]" \
            --output tsv)

          STATIC_WEB_APP_RESOURCE_GROUP=$(az resource list \
            --query "[?type=='Microsoft.Web/staticSites' && tags.owner=='$OWNER_TAG' && tags.component=='frontend'].resourceGroup | [0]" \
            --output tsv)

          KEYVAULT_NAME=$(az resource list \
            --query "[?type=='Microsoft.KeyVault/vaults' && tags.owner=='$OWNER_TAG' && tags.component=='keyvault'].name | [0]" \
            --output tsv)

          if [ -z "$BACKEND_APP_NAME" ]; then
            echo "ERROR: Backend App Service not found using tags."
            exit 1
          fi

          if [ -z "$BACKEND_RESOURCE_GROUP" ]; then
            echo "ERROR: Backend resource group not found."
            exit 1
          fi

          if [ -z "$STATIC_WEB_APP_NAME" ]; then
            echo "ERROR: Static Web App not found using tags."
            exit 1
          fi

          if [ -z "$STATIC_WEB_APP_RESOURCE_GROUP" ]; then
            echo "ERROR: Static Web App resource group not found."
            exit 1
          fi

          if [ -z "$KEYVAULT_NAME" ]; then
            echo "ERROR: Key Vault not found using tags."
            exit 1
          fi

          echo "backend=$BACKEND_APP_NAME" >> "$GITHUB_OUTPUT"
          echo "backend_rg=$BACKEND_RESOURCE_GROUP" >> "$GITHUB_OUTPUT"
          echo "frontend=$STATIC_WEB_APP_NAME" >> "$GITHUB_OUTPUT"
          echo "frontend_rg=$STATIC_WEB_APP_RESOURCE_GROUP" >> "$GITHUB_OUTPUT"
          echo "keyvault=$KEYVAULT_NAME" >> "$GITHUB_OUTPUT"

      - name: Resolve backend URL
        id: backend
        shell: bash
        run: |
          BACKEND_HOST=$(az webapp show \
            --resource-group "${{ steps.resources.outputs.backend_rg }}" \
            --name "${{ steps.resources.outputs.backend }}" \
            --query defaultHostName \
            --output tsv)

          if [ -z "$BACKEND_HOST" ]; then
            echo "ERROR: Backend hostname not found."
            exit 1
          fi

          echo "url=https://${BACKEND_HOST}/api" >> "$GITHUB_OUTPUT"

      - name: Read backend API key
        id: apikey
        shell: bash
        run: |
          API_KEY=$(az keyvault secret show \
            --vault-name "${{ steps.resources.outputs.keyvault }}" \
            --name backend-api-key \
            --query value \
            --output tsv)

          if [ -z "$API_KEY" ]; then
            echo "ERROR: Backend API key not found."
            exit 1
          fi

          echo "::add-mask::$API_KEY"
          echo "value=$API_KEY" >> "$GITHUB_OUTPUT"

      - name: Inject production configuration
        env:
          API_BASE_URL: ${{ steps.backend.outputs.url }}
          API_KEY: ${{ steps.apikey.outputs.value }}
        shell: bash
        run: |
          sed -i "s#https://REPLACE_WITH_PROD_API_URL/api#${API_BASE_URL}#" \
            src/environments/environment.ts

          sed -i "s#__BACKEND_API_KEY__#${API_KEY}#" \
            src/environments/environment.ts

      - name: Build Angular
        run: npm run build

      - name: Get Static Web App deployment token
        id: swa
        shell: bash
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name "${{ steps.resources.outputs.frontend }}" \
            --resource-group "${{ steps.resources.outputs.frontend_rg }}" \
            --query "properties.apiKey" \
            --output tsv)

          if [ -z "$TOKEN" ]; then
            echo "ERROR: Static Web App deployment token not found."
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: dist/azure-quiz-frontend/browser
          output_location: ""
          skip_app_build: true
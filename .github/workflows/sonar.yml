name: SAST - SonarCloud-frontend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  sast:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node js
        uses: actions/setup-node@v4 
        with:
          node-version: "22"
          cache: npm

      - name: install dependancies 
        run: npm ci

      - name: Build Angular application
        run: npm run build

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.TOKEN_FRONTEND_SONAR }}
        with:
          args: >
            -Dsonar.projectKey=aichaconteneur
            -Dsonar.organization=aichaconteneur
            -Dsonar.sources=src/main
            -Dsonar.tests=src/test
            -Dsonar.java.binaries=target/classes
